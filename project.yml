name: DailyArcade
options:
  bundleIdPrefix: in.dailyarcade
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ''
targets:
  DailyArcade:
    type: application
    platform: iOS
    sources:
      - path: DailyArcade
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.dailyarcade.app
        INFOPLIST_KEY_CFBundleDisplayName: Daisy
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  DailyArcadeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DailyArcadeUITests]
    dependencies:
      - target: DailyArcade
schemes:
  DailyArcade:
    build:
      targets:
        DailyArcade: all
    test:
      targets: [DailyArcadeUITests]
